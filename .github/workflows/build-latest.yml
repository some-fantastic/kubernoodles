name: Build and scan all runners

on:
 workflow_dispatch:
 schedule:
   - cron: "43 6 * * 0" # Every Sunday at 6:43 AM UTC

jobs:
 build-all:
   name: Scan ${{ matrix.os }} (${{ matrix.platform.arch }})
   runs-on: ${{ matrix.platform.runner }}
   permissions:
     contents: read
     security-events: write
   strategy:
     fail-fast: false
     matrix:
       os:
         - rootless-ubuntu-jammy
         - rootless-ubuntu-numbat
         - rootless-ubuntu-resolute
         - ubi8
         - ubi9
         - ubi10
         - wolfi
       platform:
         - arch: amd64
           runner: ubuntu-24.04
         - arch: arm64
           runner: ubuntu-24.04-arm

   steps:
     - name: Checkout the repo
       uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
       with:
         persist-credentials: false

     - name: Set up Docker Buildx
       uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

     - name: Build the local image
       uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
       with:
         context: .
         file: ./images/${{ matrix.os }}.Dockerfile
         platforms: linux/${{ matrix.platform.arch }}
         tags: local/${{ matrix.os }}:${{ matrix.platform.arch }}
         load: true
         push: false
         provenance: false
         sbom: false

     - name: Scan the local image
       uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
       id: scan
       with:
         image: "docker:local/${{ matrix.os }}:${{ matrix.platform.arch }}"
         output-format: sarif
         fail-build: false

     - name: Upload the container scan report
       uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v3.29.5
       with:
         sarif_file: ${{ steps.scan.outputs.sarif }}
         category: "image=${{ matrix.os }};platform=linux-${{ matrix.platform.arch }}"
         wait-for-processing: true
